name: DataPulse
options:
  bundleIdPrefix: com.datapulse
  deploymentTarget:
    iOS: "16.0"
targets:
  DataPulse:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datapulse.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DataPulse
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing, location]
        BGTaskSchedulerPermittedIdentifiers: [com.datapulse.refresh]
        NSLocationWhenInUseUsageDescription: "لمعرفة اسم شبكة الواي فاي المتصل بها وتسجيل الاستهلاك عليها."
        NSLocationAlwaysAndWhenInUseUsageDescription: "لتسجيل الاستهلاك في الخلفية بدقة حتى عند إغلاق التطبيق."
    entitlements:
      path: Sources/DataPulse.entitlements
      properties:
        com.apple.developer.networking.wifi-info: true
